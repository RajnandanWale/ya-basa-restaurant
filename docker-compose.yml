services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yabasa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["yabasa_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d yabasa"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yabasa?schema=public
      JWT_SECRET: change-this-in-production
      PORT: 5000
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  yabasa_pg:
