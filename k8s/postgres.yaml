apiVersion: apps/v1
kind: Deployment
metadata: {name: ya-basa-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: ya-basa-postgres}}
  template:
    metadata: {labels: {app: ya-basa-postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: yabasa}
        - {name: POSTGRES_USER, value: postgres}
        - {name: POSTGRES_PASSWORD, value: postgres}
        ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: ya-basa-postgres}
spec:
  selector: {app: ya-basa-postgres}
  ports: [{port: 5432, targetPort: 5432}]
